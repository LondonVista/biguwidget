<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BigUwidget - Usage Calendar</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      padding: 10px;
      background: transparent;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #calendar-modal {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 14px;
      padding: 14px 16px;
      box-sizing: border-box;
      overflow: hidden;
    }
    #cal-scroll-area {
      flex: 1;
      overflow-y: auto !important;
      scrollbar-width: thin;
      padding-right: 4px;
      margin-top: 4px;
    }
    #cal-scroll-area::-webkit-scrollbar {
      display: block !important;
      width: 5px !important;
    }
    #cal-scroll-area::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 99px;
    }
  </style>
</head>
<body>
  <div id="calendar-modal" class="card">
    <div id="cal-header-root"></div>
    <div id="cal-scroll-area">
      <div id="cal-content-root"></div>
    </div>
  </div>
  <script src="calendar.js"></script>
</body>
</html>
