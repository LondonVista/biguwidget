<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>BigUwidget Settings</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      margin: 0;
      padding: 10px;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      height: 100vh;
      box-sizing: border-box;
      overflow: hidden;
    }
    #settings-modal {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <div id="settings-modal" class="card settings"></div>
  <script src="settings.js"></script>
</body>
</html>
